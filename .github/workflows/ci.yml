name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Mock integration tests (stdio)
        run: node test/e2e.mjs
      - name: Mock integration tests (streamable HTTP)
        run: node test/http-test.mjs
      - name: Mock integration tests (OAuth / lazy auth)
        run: node test/oauth-test.mjs
      - name: Live spec-discovery test
        run: node test/discovery-test.mjs
      - name: Validate desktop-extension manifest
        run: npx mcpb validate manifest.json
      - name: Build desktop extension (.mcpb)
        run: npm run build:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: kudosity-mcp-mcpb
          path: dist-mcpb/*.mcpb
          if-no-files-found: error
